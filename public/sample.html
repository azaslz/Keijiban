<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
      background: #f7f7f7;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }
    h1 {
      color: #1f2937;
    }
    p {
      margin: 16px 0;
    }
    .note {
      background: #eef2ff;
      border-left: 4px solid #6366f1;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>サンプルページ</h1>
    <p>このファイルは Google Apps Script とは関係のない純粋な HTML サンプルです。</p>
    <div class="note">
      <strong>説明:</strong> ここに静的なコンテンツを置き、`public` 配下のフロントエンドページとして利用できます。
    </div>
    <p>必要に応じて、さらに CSS や JavaScript を追加してカスタマイズしてください。</p>
    <p><a href="keijiban.html">掲示板ページを開く</a></p>
  </div>
</body>
</html>
